<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>web3min — sedang offline</title>
    <meta name="theme-color" content="#FFF6EE" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #FFF6EE;
        color: #3B2218;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .card {
        width: 100%;
        max-width: 22rem;
        padding: 28px 24px;
        border: 2px solid rgba(59, 34, 24, 0.2);
        border-radius: 24px;
        background: linear-gradient(to bottom, #fff, #FFF9F5 55%, #FDEEE4);
        box-shadow: 0 6px 0 #3B2218, 0 12px 28px -4px rgba(59, 34, 24, 0.14);
        text-align: center;
      }
      .badge {
        display: inline-grid;
        place-items: center;
        width: 88px;
        height: 88px;
        border-radius: 999px;
        border: 2px solid #3B2218;
        background: #FFE3EC;
        box-shadow: 0 4px 0 #3B2218;
        font-size: 40px;
        line-height: 1;
      }
      h1 {
        margin: 16px 0 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 8px 0 0;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.6;
        color: #6B4A3A;
      }
      .note {
        margin-top: 16px;
        padding: 12px 14px;
        border: 2px solid #1E9E78;
        border-radius: 16px;
        background: #F0FDF4;
        box-shadow: 0 2px 0 #1E9E78;
        font-size: 12px;
        font-weight: 700;
        color: #064E3B;
        text-align: left;
      }
      button {
        margin-top: 20px;
        width: 100%;
        min-height: 48px;
        border: 2px solid #3B2218;
        border-radius: 16px;
        background: #E8437F;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 4px 0 #3B2218;
        transition: transform 0.09s ease, box-shadow 0.09s ease;
      }
      button:hover { background: #D62A78; }
      button:active { transform: translateY(4px); box-shadow: none; }
      button:focus-visible { outline: 3px solid #3B2218; outline-offset: 2px; }
      button[disabled] { opacity: 0.5; cursor: default; }
      a { color: #6B4A3A; font-size: 12px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge" role="img" aria-label="Blobi kebingungan">🧭</span>
      <h1>Blobi kehilangan sinyal</h1>
      <p>Kamu sedang offline. Progres belajarmu aman tersimpan di perangkat ini.</p>

      <div class="note">✅ XP, koin, streak, dan blok yang sudah selesai tetap ada. Sinkronisasi ke server jalan otomatis begitu koneksi kembali.</div>

      <button type="button" id="retry">Coba Sambung Lagi</button>
      <p><a href="/">← Kembali ke Peta Rantai</a></p>
    </main>

    <script>
      const btn = document.getElementById("retry");
      const label = btn.textContent;

      function refresh() {
        btn.disabled = true;
        btn.textContent = "Menyambung…";
        location.reload();
      }

      btn.addEventListener("click", refresh);
      window.addEventListener("online", refresh);

      // Kalau koneksi sudah kembali sementara layar ini terbuka, langsung muat ulang.
      if (navigator.onLine) refresh();
    </script>
  </body>
</html>
