<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Ikon tab browser. Versi sebelumnya wajahnya hanya menempati 20x14 dari
       32x32, jadi di 16px cuma jadi bintik yang tak dikenal. Versi ini
       memperbesar wajah ke 22x17 (69% lebar) supaya tetap terbaca di tab. -->
  <rect width="32" height="32" rx="6" fill="#FFF7F9"/>
  <rect x="2" y="2" width="28" height="28" rx="5" fill="#FFD4DE"/>
  <!-- telinga / panel samping -->
  <rect x="3" y="10" width="3" height="12" fill="#F8A0B0"/>
  <rect x="26" y="10" width="3" height="12" fill="#F8A0B0"/>
  <!-- wajah -->
  <rect x="5" y="8" width="22" height="17" fill="#F25D7A"/>
  <!-- mata -->
  <rect x="7" y="6" width="7" height="7" fill="#FFF7F9"/>
  <rect x="18" y="6" width="7" height="7" fill="#FFF7F9"/>
  <rect x="9" y="8" width="3" height="3" fill="#3B1F2A"/>
  <rect x="20" y="8" width="3" height="3" fill="#3B1F2A"/>
  <!-- hidung & mulut -->
  <rect x="14" y="15" width="4" height="2" fill="#E09A18"/>
  <rect x="12" y="19" width="8" height="2" fill="#B83A54"/>
</svg>
