    const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-12)}),signal:ctl.signal});
    if(r.status===429)throw new Error('rate');
    if(!r.ok)throw new Error('http'+r.status);
    const j=await r.json();reply=j.reply;mood=j.mood||'';if(!reply)throw new Error('empty');
  }catch(err){ok=false;const m=String(err&&err.message);
    reply=m==='rate'?'Aku lagi kebanjiran pertanyaan. Coba lagi sebentar ya!':(m==='http404'||location.protocol==='file:')?'Mode demo: otakku belum tersambung ke server.':'Koneksi ke server bermasalah. Coba lagi ya!'}
  finally{clearTimeout(to);busy=false;$('snd').disabled=false}
  if(ok)hist.push({role:'assistant',content:reply});else hist.pop();
  add(reply,'b');if(ok){typeof react==='function'&&react(reply,false,mood);speak(reply)}else{state='idle';typeof feel==='function'&&feel('sad',3)}chips()}
const POOL=['Apa itu web3?','Cara kenali penipu crypto','Apa itu seed phrase?','Bedanya CEX dan DEX?','Apa itu gas fee?','Apa itu airdrop?','Apa itu stablecoin?','Amankah simpan di dompet?'],asked=new Set();
function chips(){const box=$('chips');box.textContent='';
  POOL.filter(q=>!asked.has(q)).sort(()=>Math.random()-.5).slice(0,4).forEach(q=>{const b=document.createElement('button');b.className='c';b.textContent=q;b.onclick=()=>{asked.add(q);send(q)};box.appendChild(b)})}
$('snd').onclick=()=>{send($('t').value);$('t').value=''};
$('t').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('snd').click()}};
add('Hai, aku Blobi! Ketuk atau putar aku, atau tanya soal web3 ya.','b');kick=1;chips();
